name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ultralytics/speciesnet/birdnetlib are heavy and network-dependent;
          # CI installs only what's needed to run the test suite against the
          # graceful-fallback code paths, not the full ML stack.
          pip install fastapi uvicorn sqlalchemy pydantic pydantic-settings \
                      python-jose passlib bcrypt python-multipart email-validator \
                      pytest httpx
      - name: Run tests
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build

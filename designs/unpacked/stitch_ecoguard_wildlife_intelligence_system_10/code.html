<!-- Login Card Container -->
<div class="relative z-10 w-full max-w-[440px] px-margin-mobile md:px-0">
<div class="bg-surface-container-lowest rounded-xl shadow-xl p-xl flex flex-col gap-xl">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-sm relative pb-md">
<!-- Brand Icon Placeholder -->
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container mb-md shadow-sm relative overflow-hidden group">
<span class="material-symbols-outlined text-display-lg group-hover:scale-110 transition-transform duration-500 ease-out">radar</span>
<div class="absolute inset-0 bg-primary/10 rounded-full scale-0 group-hover:scale-150 transition-transform duration-700 ease-out"></div>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">Wildlife Population Intelligence</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Secure access to real-time ecological monitoring and analytics.</p>
<!-- Subtle separator -->
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-12 h-px bg-outline-variant/30"></div>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault(); document.getElementById('login-btn').classList.add('opacity-80'); document.getElementById('login-text').innerText = 'Authenticating...'; setTimeout(() => { document.getElementById('login-btn').classList.remove('opacity-80'); document.getElementById('login-text').innerText = 'Log In'; }, 1500);">
<!-- Input Group: Email -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="email">Researcher Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors duration-300 text-[20px]">mail</span>
</div>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg py-md pl-[44px] pr-md outline-none focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-300 placeholder-outline-variant" id="email" placeholder="dr.smith@conservation.org" required="" type="email"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="password">Access Key</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors duration-200" href="#">Forgot key?</a>

<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors duration-300 text-[20px]">lock</span>
</div>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg py-md pl-[44px] pr-[44px] outline-none focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-300 placeholder-outline-variant" id="password" placeholder="••••••••" required="" type="password"/>

<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface-variant focus:outline-none transition-colors duration-200" onclick="const p = document.getElementById('password'); const i = this.querySelector('span'); if(p.type==='password'){p.type='text'; i.innerText='visibility_off';}else{p.type='password'; i.innerText='visibility';}" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>

</div>
</div>

</div>

<div class="mt-lg flex justify-center items-center gap-sm opacity-70">
<div class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-secondary"></span>
</div>
<span class="font-label-md text-label-md text-on-background/70 uppercase tracking-widest text-[10px]">All Systems Operational</span>
</div>
</div>

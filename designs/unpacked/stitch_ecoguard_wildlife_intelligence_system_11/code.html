<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Join the Network</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create your researcher or admin account to access the monitoring dashboard.</p>
</div>

<form class="p-xl flex flex-col gap-lg bg-surface-container-lowest">
<div class="flex flex-col gap-sm relative group">

<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 transform -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">person</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg py-md pl-[48px] pr-md outline-none transition-all duration-300 focus:bg-surface-container-lowest focus:ring-1 focus:ring-primary focus:shadow-[0_0_15px_rgba(1,45,29,0.1)] placeholder:text-outline-variant" id="fullName" name="fullName" placeholder="Dr. Jane Doe" type="text"/>
</div>
</div>
<div class="flex flex-col gap-sm relative group">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 transform -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg py-md pl-[48px] pr-md outline-none transition-all duration-300 focus:bg-surface-container-lowest focus:ring-1 focus:ring-primary focus:shadow-[0_0_15px_rgba(1,45,29,0.1)] placeholder:text-outline-variant" id="email" name="email" placeholder="jane.doe@conservation.org" type="email"/>
</div>
</div>
<div class="flex flex-col gap-sm relative group">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="role">Assigned Role</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 transform -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">badge</span>
<select class="w-full appearance-none bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg py-md pl-[48px] pr-[48px] outline-none transition-all duration-300 focus:bg-surface-container-lowest focus:ring-1 focus:ring-primary focus:shadow-[0_0_15px_rgba(1,45,29,0.1)] cursor-pointer" id="role" name="role">
<option value="researcher">Field Researcher</option>
<option value="admin">System Administrator</option>
<option value="analyst">Data Analyst</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 transform -translate-y-1/2 text-outline-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="flex flex-col gap-sm relative group">

<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 transform -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">lock</span>

</div>
</div>
</div>

</p>

</div>
</div>
</div>

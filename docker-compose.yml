version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: wildlife_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wildlife_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildlife_password}
      POSTGRES_DB: ${POSTGRES_DB:-wildlife_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wildlife_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildlife_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wildlife_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildlife_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wildlife_backend
    environment:
      DATABASE_URL: postgresql://wildlife_user:wildlife_password@postgres:5432/wildlife_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENVIRONMENT: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - wildlife_uploads:/uploads
    networks:
      - wildlife_network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wildlife_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - wildlife_network
    restart: unless-stopped

  # Optional: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: wildlife_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - wildlife_network
    restart: unless-stopped
    profiles: ["production"]

volumes:
  postgres_data:
  redis_data:
  wildlife_uploads:

networks:
  wildlife_network:
    driver: bridge

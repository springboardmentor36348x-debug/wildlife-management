services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wildlife_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - wildlife_uploads:/app/uploads
      - wildlife_models:/app/model_cache
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-wildlife_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wildlife_password}
      - POSTGRES_DB=${POSTGRES_DB:-wildlife_db}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=${DATABASE_URL:-postgresql://wildlife_user:wildlife_password@postgres:5432/wildlife_db}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo_admin:mongo_password@mongodb:27017/}
      - MONGO_DB=${MONGO_DB:-wildlife_mongo}
      # Was never passed through, so JWTs were signed with the config.py default.
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
      - UPLOAD_DIR=/app/uploads
      - MODEL_CACHE_DIR=/app/model_cache
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - postgres
      - mongodb
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wildlife_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    command: npm run dev

  postgres:
    image: postgis/postgis:15-3.3
    container_name: wildlife_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wildlife_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildlife_password}
      POSTGRES_DB: ${POSTGRES_DB:-wildlife_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7.0
    container_name: wildlife_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo_password}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  postgres_data:
  mongodb_data:
  wildlife_uploads:
  wildlife_models:

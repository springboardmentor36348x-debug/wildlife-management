server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing: any unmatched path falls back to
    # index.html so deep links (e.g. /population, /gis-mapping) work on
    # a hard refresh instead of 404ing at the nginx level.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
